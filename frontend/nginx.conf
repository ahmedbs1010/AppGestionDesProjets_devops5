server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Appels API -> conteneur backend (via le réseau Docker)
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Routage Angular (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
